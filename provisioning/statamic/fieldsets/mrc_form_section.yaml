fields:
  -
    handle: anchor_id
    field:
      type: text
      display: 'Anchor ID'
      instructions: 'Used for in-page navigation, e.g. ''contact'' → /page#contact. No spaces or special characters.'
  -
    handle: variant
    field:
      type: select
      display: Variant
      default: form_inline
      options:
        form_inline: 'Inline (full-width)'
        form_split: 'Split (text left, form right)'
        form_panel: 'Panel (card style)'
  -
    handle: heading
    field:
      type: text
      display: Title
  -
    handle: subtitle
    field:
      type: textarea
      display: Description
  -
    handle: form
    field:
      type: form
      display: Form
      instructions: 'Select the form to embed. Forms are managed in Tools → Forms.'
  -
    handle: submit_label
    field:
      type: text
      display: 'Submit button label'
      instructions: 'Tekst op de verzendknop. Leeg = standaard.'
  -
    handle: post_submit
    field:
      type: button_group
      display: 'Na verzenden'
      default: message
      options:
        message: 'Bericht tonen'
        redirect: 'Doorsturen naar pagina/URL'
  -
    handle: success_message
    field:
      type: textarea
      display: Bedanktekst
      instructions: 'Wordt getoond na een succesvolle verzending.'
      if:
        post_submit: 'equals message'
  -
    handle: redirect_target
    field:
      type: link
      display: 'Doorsturen naar'
      instructions: 'Kies een entry, een intern pad (/bedankt) of een volledige externe URL (https://…).'
      if:
        post_submit: 'equals redirect'
