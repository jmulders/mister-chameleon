fields:
  -
    handle: slot_type
    field:
      type: select
      display: 'Slot Type'
      instructions: 'Fixed by the template — identifies which adaptive slot this is. Do not change.'
      options:
        hero: 'Hero'
        proof: 'Social Proof'
        cta: 'Call to Action'
        feature: 'Features'
        conversion: 'Conversion'
        notification: 'Notification'
        form: 'Form'
      validate: required
  -
    handle: form_type
    field:
      type: select
      display: 'Form type'
      instructions: 'Which form this slot shows. Only used for the Form slot type.'
      options:
        contact: 'Contact'
        application: 'Application'
        appointment: 'Appointment'
      if:
        slot_type: 'equals form'
      validate:
        - 'required_if:slot_type,form'
  -
    handle: variant_key
    field:
      type: text
      display: 'Default Variant'
      instructions: 'Variant key shown when no personalisation rule matches (e.g. hero_default). The platform may override this at runtime.'
  -
    handle: is_active
    field:
      type: toggle
      display: Active
      default: true
      instructions: 'Inactive slots are skipped entirely — visitors see nothing in this position.'
