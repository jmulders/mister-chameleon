<svg width="200" height="80" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Nascita Consulting</title>
  <desc>Scallop shell mark with NASCITA CONSULTING wordmark</desc>

  <!-- Shell body -->
  <path d="M 275,98 Q 272,86 292,78 Q 293,65 314,65 Q 323,51 340,60 Q 357,51 366,65 Q 387,65 388,78 Q 408,86 405,98 L 340,135 Z"
        fill="#C4892A"/>

  <!-- Ribs -->
  <g stroke="#7A4F14" stroke-width="1" fill="none" opacity="0.75">
    <line x1="340" y1="135" x2="275" y2="98"/>
    <line x1="340" y1="135" x2="292" y2="78"/>
    <line x1="340" y1="135" x2="314" y2="65"/>
    <line x1="340" y1="135" x2="340" y2="60"/>
    <line x1="340" y1="135" x2="366" y2="65"/>
    <line x1="340" y1="135" x2="388" y2="78"/>
    <line x1="340" y1="135" x2="405" y2="98"/>
  </g>

  <!-- Shell outline -->
  <path d="M 275,98 Q 272,86 292,78 Q 293,65 314,65 Q 323,51 340,60 Q 357,51 366,65 Q 387,65 388,78 Q 408,86 405,98 L 340,135 Z"
        fill="none" stroke="#8A5A14" stroke-width="1.5"/>

  <circle cx="340" cy="135" r="3" fill="#8A5A14"/>

  <!-- Wordmark -->
  <text x="340" y="177"
        font-family="Georgia, Palatino, 'Times New Roman', serif"
        font-size="28" font-weight="normal" letter-spacing="6"
        text-anchor="middle" fill="#0F1420">NASCITA</text>

  <text x="343" y="197"
        font-family="Georgia, Palatino, 'Times New Roman', serif"
        font-size="11" letter-spacing="5"
        text-anchor="middle" fill="#7A5535">CONSULTING</text>
</svg>
