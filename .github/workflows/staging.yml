name: Deploy — Staging

# ── Trigger ────────────────────────────────────────────────────────────────────
#
# Auto-deploys to staging on every push to `develop`.
# Can also be triggered manually via workflow_dispatch.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip DB migrations"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Run tests before deploying
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (pre-deploy gate)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_SESSION_SECRET:          test-session-secret-not-for-production
      MC_HOMEPAGE_DECISION_PROVIDER: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # One command, so this gate cannot drift from ci.yml or from what a
      # developer runs locally. It was three separate steps here, in ci.yml and
      # in production.yml — and all three called `npx tsc --noEmit` without
      # `next typegen` first, so all three failed on a clean checkout (next-env.d.ts
      # is gitignored). Because migrate/deploy need this job, nothing downstream
      # has run. `npm run verify` = lint + typecheck (typegen + tsc) + tests.
      - run: npm run verify

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Apply DB migrations to staging Supabase project
  # ─────────────────────────────────────────────────────────────────────────────
  migrate:
    name: DB Migrations — Staging
    needs: [test]
    if: ${{ github.event.inputs.skip_migrations != 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN:   ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:    ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_PROJECT_ID:      ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $STAGING_PROJECT_ID

      - name: Push migrations
        run: supabase db push

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Deploy to Vercel staging
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel — Staging
    needs: [migrate]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID:   ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env (staging)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Alias to staging domain
        run: |
          vercel alias ${{ steps.deploy.outputs.url }} staging.misterchameleon.com \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Run validation against staging
        run: |
          echo "Validating staging deployment..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.misterchameleon.com/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed: HTTP $STATUS"
