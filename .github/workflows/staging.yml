name: Deploy — Staging

# ── Trigger ────────────────────────────────────────────────────────────────────
#
# Auto-deploys to staging on every push to `develop`.
# Can also be triggered manually via workflow_dispatch.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip DB migrations"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Run tests before deploying
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (pre-deploy gate)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_SESSION_SECRET:          test-session-secret-not-for-production
      MC_HOMEPAGE_DECISION_PROVIDER: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # One command, so this gate cannot drift from ci.yml or from what a
      # developer runs locally. It was three separate steps here, in ci.yml and
      # in production.yml — and all three called `npx tsc --noEmit` without
      # `next typegen` first, so all three failed on a clean checkout (next-env.d.ts
      # is gitignored). Because migrate/deploy need this job, nothing downstream
      # has run. `npm run verify` = lint + typecheck (typegen + tsc) + tests.
      - run: npm run verify

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Apply DB migrations to staging Supabase project
  # ─────────────────────────────────────────────────────────────────────────────
  migrate:
    name: DB Migrations — Staging
    needs: [test]
    if: ${{ github.event.inputs.skip_migrations != 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN:   ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:    ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_PROJECT_ID:      ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # ── Preflight: zeg wélk secret ontbreekt ────────────────────────────────
      #
      # Zonder dit is een leeg secret een cryptische exit 1: `supabase link
      # --project-ref` zonder waarde faalt met een parse-fout over een vlag, niet
      # met "je hebt geen project ref". Deze job is nog nooit geslaagd, dus alles
      # hierachter is ongetest terrein — dan wil je dat de eerste hobbel zichzelf
      # aanwijst.
      - name: Check secrets
        run: |
          MISSING=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ]  && MISSING="$MISSING STAGING_DB_PASSWORD"
          [ -z "$STAGING_PROJECT_ID" ]     && MISSING="$MISSING STAGING_SUPABASE_PROJECT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Ontbrekende secrets:$MISSING"
            echo ""
            echo "Zet ze in Settings → Secrets and variables → Actions."
            echo "Environment secrets (scope: staging) hebben voorrang op repository secrets."
            exit 1
          fi
          echo "Alle drie de secrets zijn gezet."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $STAGING_PROJECT_ID

      - name: Push migrations
        run: supabase db push

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. (verwijderd) Deploy to Vercel — Staging
  # ─────────────────────────────────────────────────────────────────────────────
  #
  # Hier stond een deploy-job: vercel pull → vercel build → vercel deploy
  # --prebuilt → alias naar staging.misterchameleon.nl → health check.
  #
  # Die is weg om dezelfde reden als in production.yml: `vercel pull` krijgt voor
  # elke variabele die in Vercel als Sensitive staat de letterlijke waarde
  # "[SENSITIVE]" terug — 52 van de 73 — dus `vercel build` in een runner kan niet
  # bouwen wat Vercel zelf bouwt. Zie de uitgebreide notitie in production.yml.
  #
  # Er is ook niets om naartoe te deployen. Er bestaat geen staging-project in
  # Supabase, `staging.misterchameleon.nl` is nooit aangemaakt, en deze hele
  # workflow triggert op `develop` — een branch die 165 commits achterloopt en
  # waar niemand naartoe pusht. Deze job heeft nog nooit gedraaid.
  #
  # Wil je ooit echt staging: begin bij een apart Supabase-project en een domein
  # dat bestaat. Niet bij een job die doet alsof beide er al zijn.
