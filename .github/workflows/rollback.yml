name: Rollback — Production

# ── Manual rollback to a previous production deployment ───────────────────────
#
# Use this when a production deploy causes issues and you need to revert fast.
# Does NOT touch the database — only redeploys the previous Vercel build.
#
# ─── When to use rollback vs hotfix ─────────────────────────────────────────
#
#   Rollback      — code/UI regression with no DB schema change involved.
#                   Repoints Vercel to a previous deployment (seconds).
#
#   Hotfix        — critical bug that requires a code change. Use the hotfix
#                   workflow instead.
#
#   DB rollback   — If a migration caused corruption, STOP and use Supabase
#                   Dashboard → Database → Backups to restore a point-in-time
#                   snapshot. Never attempt DB rollback via code alone.
#
# ─── Usage ───────────────────────────────────────────────────────────────────
#
#   GitHub → Actions → Rollback → Run workflow
#   Enter the Vercel deployment URL to roll back to (from vercel.com/deployments).

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Vercel deployment URL to roll back to (e.g. https://mister-chameleon-abc123.vercel.app)"
        required: true
        type: string
      reason:
        description: "Reason for rollback (for the audit log)"
        required: true
        type: string

jobs:
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    # environment: production  # uncomment to require manual approval gate
    env:
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Workflow inputs are text typed by a person (or sent by the admin API).
      # Pasting them into a `run:` script with ${{ }} makes them part of the shell
      # source, so `x; curl … | sh` in the URL field would run on the runner next
      # to VERCEL_TOKEN. They are passed as environment variables instead, and
      # the URL is checked against the shape of a Vercel deployment URL first.
      - name: Check rollback target
        env:
          DEPLOYMENT_URL: ${{ github.event.inputs.deployment_url }}
        run: |
          if ! printf '%s' "$DEPLOYMENT_URL" | grep -Eq '^(https://)?[a-z0-9][a-z0-9-]*\.vercel\.app/?$'; then
            echo "deployment_url must be a Vercel deployment URL such as https://mister-chameleon-abc123.vercel.app"
            exit 1
          fi

      - name: Log rollback intent
        env:
          DEPLOYMENT_URL: ${{ github.event.inputs.deployment_url }}
          REASON:         ${{ github.event.inputs.reason }}
          ACTOR:          ${{ github.actor }}
        run: |
          echo "═══════════════════════════════════════"
          echo "  PRODUCTION ROLLBACK"
          echo "  Target: $DEPLOYMENT_URL"
          echo "  Reason: $REASON"
          echo "  Initiated by: $ACTOR"
          echo "  Time: $(date -u)"
          echo "═══════════════════════════════════════"

      - name: Alias production domain to previous deployment
        env:
          DEPLOYMENT_URL:    ${{ github.event.inputs.deployment_url }}
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
        run: |
          # PRODUCTION_DOMAIN secret should be set to your live domain (www.misterchameleon.nl).
          # Falls back to the Vercel project default URL if the secret is not set.
          DOMAIN="$PRODUCTION_DOMAIN"
          if [ -z "$DOMAIN" ]; then
            DOMAIN="project-w9ql1.vercel.app"
          fi
          echo "Aliasing $DOMAIN → $DEPLOYMENT_URL"
          vercel alias "$DEPLOYMENT_URL" "$DOMAIN" --token="$VERCEL_TOKEN"

      - name: Post-rollback health check
        run: |
          DOMAIN="${{ secrets.PRODUCTION_DOMAIN }}"
          if [ -z "$DOMAIN" ]; then
            DOMAIN="project-w9ql1.vercel.app"
          fi
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$DOMAIN/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "ROLLBACK health check FAILED: HTTP $STATUS"
            exit 1
          fi
          echo "ROLLBACK health check PASSED: HTTP $STATUS"

      - name: Create rollback annotation (GitHub deployment)
        uses: actions/github-script@v7
        env:
          REASON: ${{ github.event.inputs.reason }}
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: `ROLLBACK: ${process.env.REASON ?? ''}`.slice(0, 140),
              auto_merge: false,
              required_contexts: [],
            });
