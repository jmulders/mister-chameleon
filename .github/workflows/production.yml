name: Deploy — Production

# ── Trigger ────────────────────────────────────────────────────────────────────
#
# Production deploys ONLY from `main`.
# Requires:
#   - PR approval from a code owner
#   - All CI checks green
#   - Manual approval via GitHub Environments (configured in repo settings)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip DB migrations (use with extreme caution)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-flight production deploy

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Final CI gate before production
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (pre-deploy gate)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_SESSION_SECRET:          test-session-secret-not-for-production
      MC_HOMEPAGE_DECISION_PROVIDER: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # See the note in staging.yml: one command, so the gate cannot drift.
      # This job stands between a push to main and `supabase db push` on the
      # production database — it is the last thing that runs before migrations.
      - run: npm run verify

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Manual approval gate (configure in Settings → Environments → production)
  # ─────────────────────────────────────────────────────────────────────────────
  approve:
    name: Approval Gate
    needs: [test]
    runs-on: ubuntu-latest
    environment: production   # requires configured reviewers in GitHub Settings
    steps:
      - name: Deployment approved
        run: echo "Production deployment approved."

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. DB migrations — production
  # ─────────────────────────────────────────────────────────────────────────────
  migrate:
    name: DB Migrations — Production
    needs: [approve]
    if: ${{ github.event.inputs.skip_migrations != 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN:    ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:     ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PRODUCTION_PROJECT_ID:    ${{ secrets.PRODUCTION_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # ── Preflight: zeg wélk secret ontbreekt ────────────────────────────────
      #
      # Zonder dit is een leeg secret een cryptische exit 1: `supabase link
      # --project-ref` zonder waarde faalt met een parse-fout over een vlag, niet
      # met "je hebt geen project ref". Deze job is nog nooit geslaagd, dus alles
      # hierachter is ongetest terrein — dan wil je dat de eerste hobbel zichzelf
      # aanwijst.
      - name: Check secrets
        run: |
          MISSING=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ]  && MISSING="$MISSING PRODUCTION_DB_PASSWORD"
          [ -z "$PRODUCTION_PROJECT_ID" ]     && MISSING="$MISSING PRODUCTION_SUPABASE_PROJECT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Ontbrekende secrets:$MISSING"
            echo ""
            echo "Zet ze in Settings → Secrets and variables → Actions."
            echo "Environment secrets (scope: production) hebben voorrang op repository secrets."
            exit 1
          fi
          echo "Alle drie de secrets zijn gezet."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project (production)
        run: supabase link --project-ref $PRODUCTION_PROJECT_ID

      - name: Push migrations
        run: supabase db push

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Health check — production
  # ─────────────────────────────────────────────────────────────────────────────
  #
  # ─── Waarom hier geen deploy-job meer staat ─────────────────────────────────
  #
  # Hier stond `Deploy to Vercel — Production`: vercel pull → vercel build →
  # vercel deploy --prebuilt. Die job heeft nooit gedraaid, en kón ook nooit
  # slagen. Op 17 juli 2026 draaide hij voor het eerst en viel om op:
  #
  #     `destination` does not start with `/`, `http://`, or `https://`
  #     {"source":"/assets/:path*","destination":"[SENSITIVE]/assets/:path*"}
  #
  # Dat was geen redactie in het log. `[SENSITIVE]` is de letterlijke waarde die
  # `vercel pull` teruggeeft voor een variabele die in Vercel als Sensitive staat
  # gemarkeerd — die zijn per ontwerp niet uitleesbaar, ook niet met een geldige
  # token. Van de 73 productievariabelen zijn er 52 zo gemarkeerd, waaronder
  # NEXT_PUBLIC_SHOW_SCENARIO_PANEL: die zou als de tekst "[SENSITIVE]" in de
  # client-bundle zijn gebakken.
  #
  # `vercel build` in een runner kan dus principieel niet bouwen wat Vercel zelf
  # bouwt. Dat repareren betekent 52 variabelen weer uitleesbaar maken — inclusief
  # STRIPE_SECRET_KEY en GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY — en dat is een echte
  # beveiligingslaag inleveren voor een job die dubbelop was.
  #
  # Dubbelop, want Vercel deployt `main` al via zijn eigen Git-integratie. Dat is
  # precies waarom deze site maandenlang live bleef terwijl deze pipeline rood
  # stond: het deployen liep hier altijd al omheen.
  #
  # ─── Wat deze workflow dus wél is ───────────────────────────────────────────
  #
  # Een gate op de DATABASE, niet op de deploy. Tests, goedkeuring, migraties,
  # en daarna een controle of de site die Vercel heeft neergezet ook echt leeft.
  #
  # LET OP, en dit is geen detail: Vercel deployt bij elke push naar main, los van
  # alles hieronder. Op het moment dat jij de approval gate goedkeurt, staat de
  # nieuwe code er al. Wil je dat ook dichtzetten, dan is dat een instelling aan
  # de Vercel-kant (Deployment Protection / Ignored Build Step), geen job hier.
  health:
    name: Health check — Production
    needs: [migrate]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.misterchameleon.nl
    steps:
      # www.misterchameleon.nl — het canonicalHostname uit
      # tenant/production-tenants.ts. Hier stond misterchameleon.com: een domein
      # dat niet van ons is. Dus zelfs mét werkende secrets zou deze check falen
      # op andermans site, en zou de deploy "mislukt" heten terwijl er niets mis
      # was.
      #
      # Vercel's eigen deploy is bij een merge meestal al klaar tegen de tijd dat
      # tests + goedkeuring + migraties voorbij zijn. De retry hieronder vangt het
      # geval waarin dat niet zo is — anders zou deze job falen op timing in
      # plaats van op gezondheid.
      - name: Health check
        run: |
          URL=https://www.misterchameleon.nl/api/health
          for POGING in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED: HTTP $STATUS (poging $POGING)"
              exit 0
            fi
            echo "Poging $POGING: HTTP $STATUS — nog 15s wachten"
            sleep 15
          done
          echo "Production health check FAILED op $URL: HTTP $STATUS na 5 pogingen"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Create GitHub release with version tag
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [health]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --experimental-strip-types scripts/release.ts \
            --create-tag \
            --push \
            --github-release
