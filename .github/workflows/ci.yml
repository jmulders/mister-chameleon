name: CI

# ── Trigger ────────────────────────────────────────────────────────────────────
#
# Runs on every PR to develop or main and on every push to develop / main.
# Feature branches get CI only when a PR is open.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel any running CI job when a newer commit arrives on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Verify — lint + typecheck + tests
  # ─────────────────────────────────────────────────────────────────────────────
  #
  # One job running one command, because the three used to be spelled out
  # separately here, in staging.yml, in production.yml and in hotfix.yml — five
  # copies of the same idea, and they had drifted. All of them called
  # `npx tsc --noEmit` without `next typegen`, which fails on a clean checkout for
  # a reason that exists on no developer's machine: next-env.d.ts and .next/types
  # are gitignored, tsconfig.json includes them, and next-env.d.ts is what teaches
  # TypeScript about Next's additions to RequestInit
  # (`fetch(url, { next: { revalidate } })`).
  #
  # So this job was red, Build (needs: [verify]) never ran, and the deploy
  # workflows never got past their own copy of it either. `npm run verify` is the
  # same command the pre-push hook runs, so local and CI cannot disagree.
  verify:
    name: Verify (lint + typecheck + tests)
    runs-on: ubuntu-latest
    env:
      # Safe placeholders for test mode — the tests use mock adapters and never
      # reach a real service. Set on this job because it now runs the tests too;
      # when lint/typecheck and tests were separate jobs, only the second had them.
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL:       ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY:  ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_SESSION_SECRET:           test-session-secret-not-for-production
      MC_HOMEPAGE_DECISION_PROVIDER:  rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build check (confirms Next.js builds without errors)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [verify]
    env:
      NEXT_PUBLIC_SUPABASE_URL:       ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY:  ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_SESSION_SECRET:           ${{ secrets.ADMIN_SESSION_SECRET }}
      MC_HOMEPAGE_DECISION_PROVIDER:  rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
