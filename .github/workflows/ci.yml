name: CI

# ── Trigger ────────────────────────────────────────────────────────────────────
#
# Runs on every PR to develop or main and on every push to develop / main.
# Feature branches get CI only when a PR is open.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel any running CI job when a newer commit arrives on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Lint + type-check
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Generate next-env.d.ts and .next/types/routes.d.ts.
      #
      # Both are gitignored, so a fresh checkout does not have them — but
      # tsconfig.json includes them, and next-env.d.ts is what teaches
      # TypeScript about Next's additions to RequestInit (`fetch(url, { next:
      # { revalidate } })`). Without this step tsc reported ~18 errors that do
      # not exist on any developer's machine, this job went red, the Build job
      # (needs: [lint]) never ran, and the whole gate quietly stopped meaning
      # anything. Cheap: typegen skips the full build.
      - name: Generate Next.js types
        run: npx next typegen

      - name: TypeScript
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Unit & integration tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # These are safe placeholder values for test mode.
      # The tests use mock adapters and do not hit real services.
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL:       ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY:  ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_SESSION_SECRET:           test-session-secret-not-for-production
      MC_HOMEPAGE_DECISION_PROVIDER:  rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Build check (confirms Next.js builds without errors)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      NEXT_PUBLIC_SUPABASE_URL:       ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY:  ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_SESSION_SECRET:           ${{ secrets.ADMIN_SESSION_SECRET }}
      MC_HOMEPAGE_DECISION_PROVIDER:  rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
